[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-driver-risk-cockpit"
version = "0.1.0"
description = "CV and signal-fusion module for the Predictive Driver Risk Cockpit"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
cv = ["numpy", "opencv-python", "mediapipe==0.10.21"]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*", "cv*"]
